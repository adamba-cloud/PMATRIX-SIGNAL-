databases:
  - name: pesamatrix-db
    databaseName: pesamatrix
    user: pesamatrix
    plan: free

services:
  - type: web
    name: pesamatrix
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/pesamatrix run build && pnpm --filter @workspace/db run push
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: pesamatrix-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: ENCRYPTION_SECRET
        generateValue: true

      - key: APP_URL
        value: https://pesamatrix.onrender.com

      - key: SMTP_HOST
        value: smtp.gmail.com

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_FROM
        value: "PESAMATRIX <noreply@pesamatrix.com>"

      - key: METAAPI_REGION
        value: london
